# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Wer ist wer? Familie, Aussehen und Charakter"
description: "Sophie schreibt ihren Eltern, wer zur Familie Parker gehört. Du lernst die Familienwörter und beschreibst Menschen nach Aussehen und Charakter."
competencies: [familie-personen]
scope: Die Seite führt die Familienwörter mum, dad, parents, brother, sister und grandma ein und zeigt, wie man Menschen beschreibt. Aussehen (Haare, Brille) sagt man mit has got oder have got, Größe und Alter mit is, den Charakter (kind, funny) nur mit is. Der Besitz steht mit ’s (Ellie’s brother). Nicht hier, weil es spätere Seiten sind. Ganze Texte über Menschen und Orte, Gefühle und Streit, Körperteile und Beschwerden.
blocks:
  - type: section
    id: einstieg
    title: Wer sitzt am Küchentisch?
    blocks:
      - type: figure
        image: images/szene-familie-personen.svg
        alt: Fünf Menschen sitzen an einem langen Tisch in einer Küche. Ein Kind hält ein Handy.
        caption: "Von links: Mrs Parker, Ellie (roter Pferdeschwanz) mit dem Handy, Sophie (Zöpfe), Peter (gelbe Jacke) und Mr Parker."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: "Sophie wohnt jetzt bei den Parkers. Am Abend sitzt die ganze Familie (family) in der Küche. Sophie will ihren Eltern in Deutschland schreiben, wer zu den Parkers gehört. Dafür hat sie einen Stammbaum gezeichnet."
      - type: figure
        image: images/stammbaum.svg
        alt: Ein Stammbaum. Oben stehen drei Erwachsene, darunter drei Kinder. Links oben hängt ein kleines Foto.
        caption: Der Stammbaum der Parkers. Sophie ist zu Gast, das Foto zeigt ihre Eltern.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: single-choice
        id: familie-personen-start
        text: Auf dem Stammbaum führen Linien von Mr und Mrs Parker zu Ellie und Peter. Wer ist Peter für Ellie?
        options:
          - text: her brother
            correct: true
            info: Peter und Ellie haben dieselben Eltern. Peter ist ein Junge, also ist er Ellies brother.
          - text: her sister
            correct: false
            info: Eine sister ist ein Mädchen. Peter ist ein Junge.
          - text: her dad
            correct: false
            info: Ein dad ist ein Vater. Peter ist ein Kind der Familie, kein Elternteil.
        explanation: Wer dieselben Eltern hat wie du und ein Junge ist, ist dein brother.
        links:
          - title: Lernlandkarte Englisch · Familie und Personenbeschreibung
            url: https://lernapps.net/apps/map/englisch/c/familie-personen/
      - type: text
        text: "**Das kannst du danach:** Du nennst die Menschen in einer Familie auf Englisch und sagst, wie sie aussehen und wie sie sind."
  - type: section
    id: neu
    title: Familienwörter, Aussehen und Charakter
    blocks:
      - type: text
        text: "**Mum** und **dad** sind deine Mama und dein Papa. Zusammen sind sie deine **parents**. Wenn du einen Bruder hast, ist er dein **brother**. Eine Schwester ist deine **sister**, und deine Oma ist deine **grandma**. Sophies Mama ist also Sophie’s mum, und Sophie’s parents wohnen in Deutschland. Das ’s sagt, zu wem jemand gehört."
      - type: table
        caption: Klassenzimmer-Poster · Die Familie
        header: [Ausdruck, Bedeutung]
        rows:
          - [mum, Mama]
          - [dad, Papa]
          - [parents, Eltern]
          - [brother, Bruder]
          - [sister, Schwester]
          - [grandma, Oma]
      - type: text
        text: "Wie sieht jemand aus? Haare, eine Brille oder einen Bart **hat** man: Mrs Parker **has got** red hair. Größe und Alter **ist** man: Mrs Parker **is** tall. Und der Charakter, also wie jemand ist, sagt man auch mit **is**: Mrs Parker **is** nice. Das Adjektiv, also das Wort für die Eigenschaft, kennst du schon aus der Wiederholungsseite."
      - type: table
        caption: Steckbrief · Mrs Parker
        header: [Was, Englisch]
        rows:
          - ["Wer?", Ellie’s mum]
          - [Aussehen, She has got red hair. She is tall.]
          - [Charakter, She is nice and helpful.]
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              **Haare, Brille, Bart:** have got oder has got (he, she, it: has got). **Größe und Alter:** am, is oder are. **Charakter:** nur am, is oder are, nie have got. Ein Adjektiv bekommt kein -s. Zu wem jemand gehört, sagt das ’s hinter dem Namen: Ellie’s dad. Kurz geht auch: she’s got, she’s tall (das ’s steht dann für has oder is).
      - type: table
        caption: Klassenzimmer-Poster · Wörter dieser Seite
        header: [Ausdruck, Bedeutung]
        rows:
          - [glasses, Brille]
          - [curly, lockig]
          - [kind, nett / freundlich]
          - [helpful, hilfsbereit]
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: matching
        id: familie-personen-paare
        text: Schau auf den Stammbaum. Wer ist das für Peter?
        material:
          - type: figure
            image: images/stammbaum.svg
            alt: Ein Stammbaum mit drei Erwachsenen oben und drei Kindern darunter.
            caption: Der Stammbaum der Parkers.
            source: eigene Zeichnung
            licence: CC-BY-4.0
        pairs:
          - { left: Mrs Parker, right: Peter’s mum }
          - { left: Mr Parker, right: Peter’s dad }
          - { left: Ellie, right: Peter’s sister }
          - { left: Grandma Parker, right: Peter’s grandma }
        distractors: [Peter’s brother]
        explanation: Ellie hat dieselben Eltern wie Peter und ist ein Mädchen.
        links:
          - title: Lernlandkarte Englisch · Familie und Personenbeschreibung
            url: https://lernapps.net/apps/map/englisch/c/familie-personen/
      - type: language-task
        id: familie-personen-wahl
        languages: { source: de, target: en }
        mode: choice
        task: Wähle die richtige Form.
        form: { case: hint, punctuation: ok }
        items:
          - cue: Mr Parker hat kurze braune Haare.
            target: Mr Parker [has got] short brown hair.
            distractors: [[is, have got]]
            mistakes:
              - answer: Mr Parker is short brown hair.
                message: Haare hat man, also has got.
          - cue: Grandma Parker ist alt.
            target: Grandma Parker [is] old.
            distractors: [[has got, are]]
            mistakes:
              - answer: Grandma Parker has got old.
                message: Das Alter ist man, also is.
          - cue: Amir hat eine Brille.
            target: Amir [has got] glasses.
            distractors: [[is, have got]]
            mistakes:
              - answer: Amir have got glasses.
                message: Zu he, she und it gehört has got, nicht have got.
          - cue: Peter ist freundlich.
            target: Peter [is] friendly.
            distractors: [[has got, are]]
            mistakes:
              - answer: Peter has got friendly.
                message: Wie jemand ist, sagt is.
        hint: Frage dich, ob man es hat oder ob man es ist.
      - type: language-task
        id: familie-personen-satz
        languages: { source: de, target: en }
        task: Schreibe den ganzen Satz.
        form: { case: hint, punctuation: ok }
        items:
          - cue: Ellie · have got · red hair
            target: "(Ellie has|Ellie's) got red hair."
            mistakes:
              - answer: Ellie have got red hair.
                message: Zu she gehört has got, nicht have got.
              - answer: Ellie is red hair.
                message: Bei Haaren steht has got.
          - cue: Amir · have got · curly black hair
            target: "(Amir has|Amir's) got curly black hair."
            mistakes:
              - answer: Amir have got curly black hair.
                message: Zu he gehört has got.
          - cue: Mr Parker · be · tall
            target: "(Mr Parker is|Mr Parker's) tall."
            mistakes:
              - answer: Mr Parker has got tall.
                message: Die Größe ist man, also is.
              - answer: Mr Parker are tall.
                message: Zu he gehört is, nicht are.
          - cue: Grandma Parker · be · kind
            target: "(Grandma Parker is|Grandma Parker's) kind."
            mistakes:
              - answer: Grandma Parker has got kind.
                message: Beim Charakter steht is.
              - answer: Grandma Parker are kind.
                message: Zu she gehört is, nicht are.
        hint: Suche zuerst das Wort für die Eigenschaft.
      - type: language-task
        id: familie-personen-uebersetzen
        languages: { source: de, target: en }
        task: Schreibe den Satz auf Englisch.
        form: { case: hint, punctuation: ok }
        items:
          - source: Peters Papa ist freundlich.
            target: "(Peter's dad is|Peter's dad's) (friendly|kind|nice)."
            mistakes:
              - answer: Peters dad is friendly.
                message: Im Englischen schreibst du hier einen Apostroph, Peter's dad.
              - answer: Peter's dad has got friendly.
                message: Beim Charakter steht is.
          - source: Ellies Bruder hat braune Haare.
            target: "(Ellie's brother has|Ellie's brother's) got brown hair."
            mistakes:
              - answer: Ellie's brother have got brown hair.
                message: Zu he gehört has got.
              - answer: Ellie's brother is brown hair.
                message: Zu Haaren passt has got.
          - source: Sophies Eltern sind nett.
            target: "Sophie's parents are (nice|kind|friendly)."
            mistakes:
              - answer: Sophie's parents is nice.
                message: Zu parents (mehrere Personen) gehört are.
              - answer: Sophie's parents are nices.
                message: Das Adjektiv bekommt nie ein -s.
        hint: Beginne mit dem Namen und dem ’s.
      - type: language-task
        id: familie-personen-korrektur
        languages: { source: de, target: en }
        task: In jedem Satz steckt ein Fehler. Schreibe den Satz richtig.
        form: { case: hint, punctuation: ok }
        items:
          - cue: Ellie have got a brother.
            target: "(Ellie has|Ellie's) got a brother."
            mistakes:
              - answer: Ellie have got a brother.
                message: Noch nicht ganz. Welche Form gehört zu she?
          - cue: Peter is Ellies brother.
            target: Peter is Ellie's brother.
            mistakes:
              - answer: Peter is Ellies brother.
                message: Noch nicht ganz. Zu wem jemand gehört, sagt das ’s mit Apostroph hinter dem Namen.
          - cue: Mrs Parker has got kind.
            target: "(Mrs Parker is|Mrs Parker's) kind."
            mistakes:
              - answer: Mrs Parker has got kind.
                message: Noch nicht ganz. Beim Charakter steht is.
        hint: Prüfe die Form von have got und das ’s.
      - type: language-task
        id: familie-personen-hoeren
        languages: { source: de, target: en }
        task: Hör zu und schreibe, was du hörst.
        form: { case: hint, punctuation: ok }
        items:
          - audio: peters-grandma-is-old-and-funny.mp3
            target: Peter's grandma is old and funny.
          - audio: my-mum-is-kind-and-clever.mp3
            target: My mum is kind and clever.
          - audio: sophies-dad-has-got-short-hair.mp3
            target: Sophie's dad has got short hair.
  - type: section
    id: anwenden
    title: Selbst sagen und schreiben
    blocks:
      - type: speaking-task
        id: familie-personen-nachsprechen
        language: en
        items:
          - audio: the-parkers-are-a-friendly-family.mp3
            text: The Parkers are a friendly family.
          - audio: peter-has-got-a-funny-grandma.mp3
            text: Peter has got a funny grandma.
          - audio: my-parents-are-friendly-people.mp3
            text: My parents are friendly people.
        hint: Hör den Satz zuerst. Sprich dann langsam nach.
      - type: table
        caption: All about me · Meine Familie (Ellies Beispiel)
        header: [Was, Englisch]
        rows:
          - ["Wer wohnt bei mir?", "I live with my mum, my dad and my brother."]
          - [Mein Bruder, "My brother is Peter. He is nine."]
          - ["Wie sieht er aus?", "He has got short brown hair."]
          - ["Wie ist er?", "He is friendly."]
      - type: open-task
        id: familie-personen-profil
        task: "Schreibe den ersten Teil deines Profils „All about me“ in dein Heft: zwei bis vier Sätze über ein Familienmitglied. Sage, wer die Person für dich ist, wie sie aussieht und wie sie ist."
        points:
          - text: Du nennst, wer die Person ist, mit einem Familienwort (zum Beispiel my mum, my brother).
            source: /menschen-beschreiben/familie-personen/#neu
          - text: Ein Satz sagt mit has got oder is, wie die Person aussieht.
            source: /menschen-beschreiben/familie-personen/#neu
          - text: Ein Satz sagt mit is, wie die Person ist.
            source: /menschen-beschreiben/familie-personen/#neu
          - text: Es sind ganze Sätze mit einem Punkt am Ende.
            kind: form
        solution: |
          My grandma is Anna. She has got grey hair. She is kind and funny.
  - type: section
    id: weiter
    title: Wie es weitergeht
    blocks:
      - type: text
        text: "Sophie hat ihren Eltern geschrieben, wer bei den Parkers wohnt. Ihre Mutter will mehr wissen: Wie ist Mrs Parker? Auf der nächsten Seite beschreibt Sophie ihre neue Familie und ihr Zimmer in einem kurzen Text."
