# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du hier
description: Begrüßen, danken und sich entschuldigen noch einmal kurz, bevor Sophie Nachrichten schreibt.
recap: englisch/gruss-hoeflichkeit
scope: Die Seite wiederholt nur Begrüßen, Anreden (auch Dear …,), Grüße am Ende (Love, Best wishes,), Danken und Entschuldigen aus dem Explainer „Hello, Millbrook!“. Neue Inhalte gibt es nicht, auch keine Übung. Hobbys und Haustiere behandelt die nächste Seite.
blocks:
  - type: section
    id: einstieg
    title: Das solltest du schon können
    blocks:
      - type: text
        text: "Sophie schreibt bald, was die Kinder in der Freizeit machen. Danach folgen eine Einladung, eine Postkarte und eine kurze E-Mail. Dafür braucht sie den Baustein „Begrüßung und Höflichkeit“. Kannst du ihn schon? **Ich kann Menschen auf Englisch angemessen begrüßen, anreden und mich höflich bedanken und entschuldigen.** Lies die Ausdrücke und prüfe in Gedanken, ob du alles kennst."
      - type: vocabulary
        caption: Klassenzimmer-Poster · Höflich sein
        languages: { source: de, target: en }
        entries:
          - target: "Hello. Hi. Good morning."
            source: "grüßen"
          - target: "Goodbye. See you."
            source: "sich verabschieden"
          - target: "Thank you. Thanks."
            source: "danken"
          - target: "Sorry. I'm sorry."
            source: "sich entschuldigen"
          - target: "Mr Hill, Mrs Parker. Dear Mum,"
            source: "jemanden anreden"
          - target: "Love, Best wishes,"
            source: "einen Brief beenden"
      - type: text
        text: "Nicht sicher? Wiederhole es auf der Seite [Begrüßung und Höflichkeit](https://lernapps.net/apps/map/englisch/c/gruss-hoeflichkeit/) der Lernlandkarte. Weiter geht es mit Sophies Freizeit: Sie schreibt ihren Eltern, welche Hobbys Ellie, Peter und Amir haben."
