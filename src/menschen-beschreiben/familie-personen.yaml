# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Wer ist wer? Familie, Aussehen und Charakter"
description: "Sophie schreibt ihren Eltern, wer zur Familie Parker gehört. Du lernst die Familienwörter und beschreibst Menschen nach Aussehen und Charakter."
competencies: [familie-personen]
scope: Die Seite führt die Familienwörter mum, dad, parents, brother, sister, grandma, grandpa, aunt, uncle und cousin ein und zeigt, wie man Menschen beschreibt. Aussehen (Haare, Brille) sagt man mit has got oder have got, Größe und Alter mit am, is oder are, den Charakter (kind, funny) nur mit am, is oder are. Zu wem jemand gehört, sagt man mit my, your, his, her oder mit ’s (Ellie’s brother), Mr heißt Herr und Mrs heißt Frau. Ganze Texte über Menschen und Orte, Gefühle und Streit sowie Körperteile und Beschwerden behandeln spätere Seiten.
blocks:
  - type: section
    id: einstieg
    title: Wer sitzt am Küchentisch?
    blocks:
      - type: figure
        image: images/szene-familie-personen.svg
        alt: Fünf Menschen sitzen an einem langen Tisch in einer Küche. Ein Kind hält ein Handy.
        caption: "Von links: Mrs Parker, Ellie (Pferdeschwanz), Sophie (Zöpfe), Peter (gelbe Jacke), Mr Parker."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: "Sophie wohnt jetzt bei den Parkers. Am Abend sitzt die Familie (family) in der Küche, Ellies und Sophies Freund Amir kommt oft zu Besuch. Mr heißt Herr und Mrs heißt Frau. Für ihre Eltern in Deutschland zeichnet Sophie einen Stammbaum: Linien führen von den Eltern zu den Kindern, die Linie nach oben zur Mutter von Mr Parker, die gestrichelte zu Sophie, die zu Gast ist."
      - type: figure
        image: images/stammbaum.svg
        alt: Ein Stammbaum in drei Reihen. Oben eine ältere Frau mit grauem Dutt, in der Mitte zwei Erwachsene, unten drei Kinder. Links hängt ein kleines Foto, darunter steht ein Name.
        caption: "Der Stammbaum der Parkers. Die gestrichelte orange Linie führt zu Sophie, die zu Gast ist. Das Foto zeigt ihre Eltern."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: single-choice
        id: familie-personen-start
        text: Auf dem Stammbaum führen Linien von Mr und Mrs Parker zu Ellie und Peter. Wer ist Peter für Ellie?
        options:
          - text: her brother
            correct: true
            info: Peter hat dieselben Eltern wie Ellie und ist ein Junge.
          - text: her sister
            correct: false
            info: Eine sister ist ein Mädchen.
          - text: her dad
            correct: false
            info: Ein dad ist ein Vater, kein Kind.
        explanation: "Dieselben Eltern, ein Junge: brother."
        links:
          - title: Lernlandkarte Englisch · Familie und Personenbeschreibung
            url: https://lernapps.net/apps/map/englisch/c/familie-personen/
      - type: text
        text: "**Das kannst du danach:** Du nennst die Menschen in einer Familie auf Englisch und sagst, wie sie aussehen und wie sie sind."
  - type: section
    id: neu
    title: Familienwörter, Aussehen und Charakter
    blocks:
      - type: text
        text: "**Mum** und **dad** sind deine Mama und dein Papa, sie heißen auch **mother** und **father**. Zusammen sind sie deine **parents**. Dein Bruder ist dein **brother**, deine Schwester deine **sister**. Deine Oma ist deine **grandma**, dein Opa dein **grandpa**. Deine Tante ist deine **aunt**, dein Onkel dein **uncle**, ein Cousin oder eine Cousine dein **cousin**. Sophies Mama ist Sophie’s mum. Das ’s sagt, zu wem jemand gehört. Über dich sagst du **my** (mein), zu jemandem **your** (dein), über einen Jungen oder Mann **his** (sein), über ein Mädchen oder eine Frau **her** (ihr)."
      - type: table
        caption: Klassenzimmer-Poster · Wörter dieser Seite
        header: [Ausdruck, Bedeutung]
        rows:
          - [glasses, Brille]
          - [ponytail, Pferdeschwanz]
          - [kind, nett / freundlich]
          - [helpful, hilfsbereit]
          - [curly, lockig]
          - [short / long, kurz / lang]
          - [clever, klug]
      - type: text
        text: "Wie sieht jemand aus? Haare, eine Brille oder einen Bart **hat** man: Mrs Parker **has got** red hair. Größe und Alter **ist** man: Mrs Parker **is** tall. Der Charakter, also wie jemand ist, wird auch mit **is** gesagt: Mrs Parker **is** nice."
      - type: example
        title: Steckbrief · Grandma Parker
        blocks:
          - type: text
            text: |
              - **Wer?** Mr Parker’s mum.
              - **Aussehen:** She has got grey hair. She is small.
              - **Charakter:** She is nice and helpful.
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              **Haare, Brille, Bart:** have got oder has got (he, she, it: has got). **Größe und Alter:** am, is oder are. **Charakter:** nur am, is oder are, nie have got. Ein Adjektiv bekommt kein -s. Kurz geht auch: she’s got, she’s tall (das ’s steht dann für has oder is).
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: matching
        id: familie-personen-paare
        text: Schau auf den Stammbaum. Wer ist das für Peter?
        material:
          - type: figure
            image: images/stammbaum.svg
            alt: Ein Stammbaum in drei Reihen mit Namen unter allen Figuren. Links hängt ein kleines Foto.
            caption: Der Stammbaum der Parkers.
            source: eigene Zeichnung
            licence: CC-BY-4.0
        pairs:
          - { left: Mrs Parker, right: Peter’s mum }
          - { left: Mr Parker, right: Peter’s dad }
          - { left: Ellie, right: Peter’s sister }
          - { left: Grandma Parker, right: Peter’s grandma }
        explanation: Ellie hat dieselben Eltern wie Peter und ist ein Mädchen, also seine sister. Peter’s brother gibt es hier nicht, Peter ist selbst der Junge.
        links:
          - title: Lernlandkarte Englisch · Familie und Personenbeschreibung
            url: https://lernapps.net/apps/map/englisch/c/familie-personen/
      - type: single-choice
        id: familie-personen-haare
        text: "Wähle die richtige Form: Mr Parker ___ short brown hair."
        options:
          - text: has got
            correct: true
            info: Haare hat man. Zu he gehört has got.
          - text: have got
            correct: false
            info: Zu he gehört has got, nicht have got.
          - text: is
            correct: false
            info: is sagt, wie jemand ist. Haare hat man.
        explanation: "Haare hat man: has got."
        links:
          - title: Lernlandkarte Englisch · Have got und has got
            url: https://lernapps.net/apps/map/englisch/c/have-got/
      - type: language-task
        id: familie-personen-besitz
        languages: { source: de, target: en }
        task: Wer spricht über wen? Schreibe den Satz mit my, your, his oder her.
        form: { case: hint, punctuation: ok }
        items:
          - source: Ellie sagt über sich selbst. Mein Bruder ist Peter.
            target: "(My brother is|My brother's) Peter."
            mistakes:
              - answer: Her brother is Peter.
                message: Ellie spricht über sich, also my.
          - source: Sophie sagt zu Ellie. Dein Bruder ist nett.
            target: "(Your brother is|Your brother's) (nice|kind|friendly)."
            mistakes:
              - answer: My brother is nice.
                message: Sophie spricht zu Ellie, also your.
          - source: Sophie sagt über Ellie. Ihre Mama ist freundlich.
            target: "(Her mum is|Her mum's|Her mother is|Her mother's) (friendly|kind|nice)."
            mistakes:
              - answer: His mum is friendly.
                message: Ellie ist ein Mädchen, also her.
          - source: Sophie sagt über Mr Parker. Seine Haare sind kurz.
            target: "(His hair is|His hair's) short."
            mistakes:
              - answer: Her hair is short.
                message: Mr Parker ist ein Mann, also his.
        hint: Wer spricht, über wen?
      - type: language-task
        id: familie-personen-satz
        languages: { source: de, target: en }
        task: Schreibe den ganzen Satz. be steht für am, is oder are.
        form: { case: hint, punctuation: ok }
        items:
          - cue: Ellie · have got · a ponytail
            target: "(Ellie has got|Ellie has|Ellie's got) a ponytail."
            mistakes:
              - answer: Ellie have got a ponytail.
                message: Zu she gehört has got, nicht have got.
          - cue: Amir · have got · glasses
            target: "(Amir has got|Amir has|Amir's got) glasses."
            mistakes:
              - answer: Amir have got glasses.
                message: Zu he gehört has got.
          - cue: Peter · be · young
            target: "(Peter is|Peter's) young."
            mistakes:
              - answer: Peter has got young.
                message: Das Alter ist man, also is.
          - cue: Grandma Parker · be · kind
            target: "(Grandma Parker is|Grandma Parker's) kind."
            mistakes:
              - answer: Grandma Parker has got kind.
                message: Beim Charakter steht is.
        hint: Hat man es, ist man es?
      - type: language-task
        id: familie-personen-uebersetzen
        languages: { source: de, target: en }
        task: Schreibe den Satz auf Englisch.
        form: { case: hint, punctuation: ok }
        items:
          - source: Herr Parker ist Peters Papa.
            target: "Mr Parker is Peter's (dad|father)."
            mistakes:
              - answer: Mrs Parker is Peter's dad.
                message: Mrs heißt Frau, Mr heißt Herr.
          - source: Frau Parker ist Ellies Mama.
            target: "Mrs Parker is Ellie's (mum|mother)."
            mistakes:
              - answer: Mr Parker is Ellie's mum.
                message: Mr heißt Herr, Mrs heißt Frau.
          - source: Meine Tante hat lockige Haare.
            target: "(My aunt has got|My aunt has|My aunt's got) curly hair."
            mistakes:
              - answer: Her aunt has got curly hair.
                message: Du sprichst über deine eigene Tante, also my.
        hint: Beginne mit my oder dem Namen.
      - type: language-task
        id: familie-personen-hoeren
        languages: { source: de, target: en }
        task: Hör zu und schreibe, was du hörst.
        form: { case: hint, punctuation: ok }
        items:
          - audio: peters-grandma-is-old-and-funny.mp3
            target: "(Peter's grandma is|Peter's grandma's) old and funny."
          - audio: my-mum-is-kind-and-clever.mp3
            target: "(My mum is|My mum's) kind and clever."
          - audio: sophies-mum-is-tall-and-happy.mp3
            target: "(Sophie's mum is|Sophie's mum's) tall and happy."
  - type: section
    id: anwenden
    title: Selbst sagen und schreiben
    blocks:
      - type: speaking-task
        id: familie-personen-nachsprechen
        language: en
        items:
          - audio: the-parkers-are-a-friendly-family.mp3
            text: The Parkers are a friendly family.
          - audio: peter-has-got-a-clever-sister.mp3
            text: Peter has got a clever sister.
          - audio: my-parents-are-friendly-people.mp3
            text: My parents are friendly people.
        hint: Hör den Satz zuerst. Sprich dann langsam nach.
      - type: text
        text: "Dein Profil „All about me“ (Alles über mich) wächst mit jeder Seite. Ellie hat ihre erste Zeile schon geschrieben. Schau, wie sie es macht."
      - type: table
        caption: All about me · Meine Familie (Ellies Beispiel)
        header: [Was, Englisch]
        rows:
          - ["Wer wohnt bei mir?", "I live with my mum, my dad and my brother."]
          - ["Mein Bruder", "My brother is Peter. He is nine."]
          - ["Wie sieht er aus?", "He has got short brown hair."]
          - ["Wie ist er?", "He is friendly."]
      - type: open-task
        id: familie-personen-profil
        task: "Schreibe den ersten Teil deines Profils „All about me“ in dein Heft. Wähle einen Menschen, der zu deiner Familie gehört oder dir wichtig ist, und schreibe zwei bis vier Sätze: Wer ist das für dich, wie sieht die Person aus und wie ist sie?"
        points:
          - text: Du nennst, wer die Person für dich ist, mit einem Wort wie my mum, my grandpa, my cousin oder my friend.
            source: /menschen-beschreiben/familie-personen/#neu
          - text: Ein Satz sagt mit has got oder is, wie die Person aussieht.
            source: /menschen-beschreiben/familie-personen/#neu
          - text: Ein Satz sagt mit is, wie die Person ist.
            source: /menschen-beschreiben/familie-personen/#neu
          - text: Es sind ganze Sätze mit einem Punkt am Ende.
            kind: form
        solution: |
          My grandma is Anna. She has got grey hair. She is kind and funny.

          Oder: My friend is Tom. He has got curly hair and glasses. He is quiet and clever.
  - type: section
    id: weiter
    title: Wie es weitergeht
    blocks:
      - type: text
        text: "Sophie schickt den Stammbaum nach Hause. Ihre Eltern wollen mehr wissen: Wie ist ihr Englischlehrer Mr Hill? Und wie ist ihr Zimmer? Auf der nächsten Seite schreibt Sophie darüber einen Text, in dem ein Satz zum nächsten passt."
