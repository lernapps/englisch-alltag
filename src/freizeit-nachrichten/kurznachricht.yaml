# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Komm zu meiner Party! Nachricht und Einladung"
description: "Amir lädt zu seinem Geburtstag ein, und Sophie antwortet. Du schreibst eine kurze Nachricht, eine Notiz und eine Einladung."
competencies: [kurznachricht]
scope: Die Seite zeigt den Bauplan einer Einladung (Anrede, Who, What, When, Where, Answer, Gruß), eine Zusage und eine Absage und eine Notiz. Zeiten stehen mit on (on Saturday), at (at five) und from … to (from five to seven). can und can't gibt es als Ausdruck, nach can steht das Verb ohne to. Eine Postkarte, ein Brief und eine E-Mail behandelt die nächste Seite.
blocks:
  - type: section
    id: einstieg
    title: Amir lädt ein
    blocks:
      - type: figure
        image: images/einladung.svg
        alt: Eine Einladungskarte mit der Überschrift Party invitation und fünf Feldern, jedes mit einer kurzen Angabe.
        caption: "Die Einladung von Amir (Brille, schwarze Locken) an Sophie, Ellie und Peter."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: "Amir bringt eine Einladung (invitation) zu seiner Geburtstagsparty mit. **Dear** heißt „liebe/lieber“, **Love,** heißt „liebe Grüße“. Sophie liest die Karte genau: In fünf Feldern steht, was sie wissen muss."
      - type: single-choice
        id: kurznachricht-start
        text: Schau auf die Einladung. Wann ist die Feier zu Ende?
        options:
          - text: at six
            correct: true
            info: Auf der Karte steht from three to six. Um sechs ist die Feier zu Ende.
          - text: at three
            correct: false
            info: Um drei fängt die Feier an.
          - text: at five
            correct: false
            info: Um fünf steht nichts auf der Karte.
        explanation: from three to six heißt von drei bis sechs.
        links:
          - title: Lernlandkarte Englisch · Kurznachricht und Einladung
            url: https://lernapps.net/apps/map/englisch/c/kurznachricht/
      - type: text
        text: "**Das kannst du danach:** Du schreibst eine Einladung, sagst zu oder ab und schreibst eine kurze Nachricht."
  - type: section
    id: neu
    title: Bauplan, Antwort und Zeit
    blocks:
      - type: text
        text: "Eine Einladung hat einen **Bauplan**. Sie beginnt mit einer Anrede (Hi Peter,). Dann folgen **Who** (wer lädt ein?), **What** (was ist es?), **When** (wann?) und **Where** (wo?). Bei **Answer** bittest du um eine Antwort. Am Ende steht ein Gruß mit deinem Namen. Eine **Zusage** (ja) und eine **Absage** (nein) sind kurz. Eine **Notiz** (note) lässt Wörter weg: Wer weg ist, schreibt nur das Wichtige. Mit **can** sagst du „kann“, mit **can't** (oder **cannot**) „kann nicht“."
      - type: vocabulary
        caption: Klassenzimmer-Poster · Wörter dieser Seite
        languages: { source: de, target: en }
        entries:
          - target: "invitation"
            source: "Einladung"
          - target: "I'd love to come."
            source: "Ich komme sehr gern."
          - target: "Back at six."
            source: "Bin um sechs zurück."
          - target: "buy"
            source: "kaufen"
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              **Zeit:** on + Tag (on Tuesday), at + Uhrzeit (at seven o'clock), from … to (from five to seven). Vor einem Tag steht on, nicht at. **Nach can** steht das Verb ohne to: I can come. Nicht: I can't to come. **Anrede und Gruß** gehören zu jeder Nachricht an eine Person (Einladung), nicht zu einer Notiz.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: ordering
        id: kurznachricht-reihenfolge
        text: Peter lädt Amir ein. Bringe die Teile der Einladung in die richtige Reihenfolge.
        items:
          - "Hi Amir,"
          - Come and play a game with me.
          - It is on Thursday from four to five.
          - It is at my house.
          - Can you come? Please tell me.
          - "See you soon, Peter"
        explanation: "Anrede, was, wann, wo, Antwort, Gruß mit Namen: So ist der Bauplan geordnet."
        links:
          - title: Lernlandkarte Englisch · Kurznachricht und Einladung
            url: https://lernapps.net/apps/map/englisch/c/kurznachricht/
      - type: language-task
        id: kurznachricht-antwort
        languages: { source: de, target: en }
        task: Schreibe den Satz auf Englisch.
        form: { case: hint, punctuation: ok }
        items:
          - source: Du sagst zu. Danke! Ich kann am Samstag kommen.
            target: (Thank you|Thanks|Thank you very much)! I can come on Saturday.
            mistakes:
              - answer: Thank you! I can to come on Saturday.
                message: Nach can kein to.
              - answer: Thank you! I can come at Saturday.
                message: Vor einem Tag steht on, nicht at.
              - answer: Thank you! I can come Saturday.
                message: Vor Saturday fehlt on.
          - source: Du sagst ab. Entschuldige, ich kann am Samstag nicht kommen.
            target: (Sorry|I'm sorry|I am sorry), I (can't|cannot) come on Saturday.
            mistakes:
              - answer: Sorry, I can't to come on Saturday.
                message: Nach can kein to.
              - answer: Sorry, I don't can come on Saturday.
                message: can braucht kein do. Sag I can't come.
              - answer: Sorry, I can not come on Saturday.
                message: can't oder cannot schreibst du zusammen.
              - answer: Sorry, I can't come at Saturday.
                message: Vor einem Tag steht on, nicht at.
          - source: Kannst du am Freitag kommen?
            target: Can you come on Friday?
            mistakes:
              - answer: Can you to come on Friday?
                message: Nach can kein to.
              - answer: Can you come at Friday?
                message: Vor einem Tag steht on, nicht at.
        hint: Nach can fehlt das to.
      - type: language-task
        id: kurznachricht-notiz
        languages: { source: de, target: en }
        task: Schreibe eine kurze Notiz. Du lässt Wörter weg.
        form: { case: hint, punctuation: ok }
        items:
          - source: Du bist um vier zurück.
            target: (Back|I'm back|I am back|I'll be back|I will be back) (at|by) (four|4)( o'clock|).
            mistakes:
              - answer: Back on four.
                message: Vor einer Uhrzeit steht at.
              - answer: Back four.
                message: Vor der Uhrzeit fehlt at.
          - source: "Du bittest: Kannst du bitte Brot kaufen?"
            target: (Can you buy bread, please|Can you buy some bread, please|Please buy bread|Please buy some bread|Buy bread, please|Buy some bread, please).
            mistakes:
              - answer: Can you to buy bread, please?
                message: Nach can kein to.
              - answer: Can you buy bread?
                message: Das Wort bitte (please) fehlt.
        hint: Eine Notiz ist kurz.
      - type: language-task
        id: kurznachricht-zeit
        languages: { source: de, target: en }
        task: Schreibe den Satz auf Englisch.
        form: { case: hint, punctuation: ok }
        items:
          - source: Das Kino ist am Freitag.
            target: The cinema is on Friday.
            mistakes:
              - answer: The cinema is Friday.
                message: Vor Friday fehlt on.
              - answer: The cinema is at Friday.
                message: Vor einem Tag steht on, nicht at.
          - source: Wir spielen von zwei bis vier.
            target: We play from (two|2) (to|until|till) (four|4)( o'clock|).
            mistakes:
              - answer: We play at two to four.
                message: Von … bis heißt from … to.
          - source: Wir treffen uns um sieben.
            target: We meet at (seven|7)( o'clock|).
            mistakes:
              - answer: We meet on seven.
                message: Vor einer Uhrzeit steht at.
        hint: Tag oder Uhrzeit?
      - type: language-task
        id: kurznachricht-hoeren
        languages: { source: de, target: en }
        task: Hör zu und schreibe, was du hörst.
        form: { case: hint, punctuation: ok }
        items:
          - audio: thank-you-for-the-invitation.mp3
            target: "Thank you for the invitation."
          - audio: please-call-me-on-monday.mp3
            target: "Please call me on Monday."
          - audio: can-you-help-me-with-my-homework.mp3
            target: "Can you help me with my homework?"
  - type: section
    id: anwenden
    title: Selbst sagen und schreiben
    blocks:
      - type: speaking-task
        id: kurznachricht-nachsprechen
        language: en
        items:
          - audio: im-in-the-garden-with-ellie.mp3
            text: "I'm in the garden with Ellie."
          - audio: please-write-back-soon.mp3
            text: "Please write back soon."
          - audio: that-sounds-great-see-you-on-saturday.mp3
            text: "That sounds great. See you on Saturday."
        hint: Hör den Satz zuerst. Sprich dann langsam nach.
      - type: text
        text: "Ellie hat für ihr Profil eine eigene Einladung geschrieben. Schau, wie sie es macht."
      - type: table
        caption: All about me · Meine Einladung (Ellies Beispiel)
        header: [Teil, Englisch]
        rows:
          - [Anrede, "Hi Sophie,"]
          - [Was und wann, "Come to the cinema with me on Friday at seven."]
          - [Antwort, "Please tell me yes or no."]
          - [Gruß, "Love, Ellie"]
      - type: open-task
        id: kurznachricht-profil
        task: "Schreibe eine Einladung für dein Profil „All about me“ in dein Heft. Du lädst eine Person zu etwas ein, das dir gefällt (zum Beispiel ein Spiel, ein Essen oder einen Besuch). Schreibe drei bis fünf kurze Sätze. Die App bewertet deinen Text nicht: Vergleiche ihn danach selbst mit den Punkten."
        points:
          - text: Die Einladung beginnt mit einer Anrede und endet mit einem Gruß und deinem Namen.
            source: /freizeit-nachrichten/kurznachricht/#neu
          - text: Sie sagt, was es ist und wo (zum Beispiel at my house).
            source: /freizeit-nachrichten/kurznachricht/#neu
          - text: Sie sagt, wann es ist, mit on, at oder from … to.
            source: /freizeit-nachrichten/kurznachricht/#neu
          - text: Sie fragt nach der Antwort (Can you come?).
            source: /freizeit-nachrichten/kurznachricht/#neu
        solution: |
          Hi Anna, come to my house on Sunday from two to four. We can play a game. Can you come? Love, Ben

          Oder: Hello Grandpa, lunch is at my house on Saturday at twelve. Please tell me yes or no. See you soon, Mia
  - type: section
    id: weiter
    title: Wie es weitergeht
    blocks:
      - type: text
        text: "Sophie sagt Amir zu und schreibt dann ihren Eltern: „Amir hat uns zu seiner Party eingeladen!“ Auf der nächsten Seite schreibt sie ihnen eine Postkarte und lernt, wie eine kurze E-Mail aussieht."
