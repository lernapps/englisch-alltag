# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Zuhause: Räume, Möbel und Garten"
description: "Sophie zeigt ihren Eltern das Haus der Parkers und ihr kleines Zimmer. Du lernst Räume und Möbel und sagst, was es wo gibt."
competencies: [wohnen]
scope: Die Seite führt die Räume (kitchen, living room, bathroom, bedroom, garden) und Möbel (sofa, bed, table, chair, desk, wardrobe, lamp und weitere) ein und zeigt, wie man sein Zuhause beschreibt. There is und there are sowie die Präpositionen in, on, under und next to werden nur angewendet; die Frage steht mit Is there und Are there, ein Haus mit Garten heißt a house with a garden, und next to heißt auch beside. Den Tagesablauf, Essen und Trinken sowie den Alltag in Großbritannien behandeln spätere Seiten.
blocks:
  - type: section
    id: einstieg
    title: Sophies Zimmer und das Haus der Parkers
    blocks:
      - type: figure
        image: images/szene-wohnen.svg
        alt: Zwei Mädchen in einem kleinen Zimmer. Eines hält ein Handy hoch.
        caption: "Sophie (Zöpfe) macht ein Foto von ihrem Zimmer. Ellie (Pferdeschwanz) schaut zu."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: "Sophie schickt Mum and Dad ein Foto von ihrem Zimmer. Es ist klein, aber schön. Dann zeichnet sie das ganze Haus der Parkers: oben die Zimmer (rooms) zum Schlafen und das Bad, unten die Küche und das Wohnzimmer, draußen den Garten. Die kleinen Zeichen sind Möbel (furniture)."
      - type: figure
        image: images/haus-querschnitt.svg
        alt: Querschnitt eines Hauses mit zwei Stockwerken und einem Garten. Die Zimmer haben Namen, die Möbel sind kleine Zeichen.
        caption: Das Haus der Parkers. Oben das Bad und vier Schlafzimmer (Ellie, Peter, Sophie, die Eltern), unten Küche und Wohnzimmer, rechts der Garten.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: single-choice
        id: wohnen-start
        text: In welchem Raum steht auf dem Bild das Sofa?
        options:
          - text: in the living room
            correct: true
            info: Das Sofa steht unten im Haus, im Wohnzimmer, zusammen mit Sessel, Bücherregal und Fernseher.
          - text: in the kitchen
            correct: false
            info: In der Küche stehen Kühlschrank, Herd und ein Tisch, kein Sofa.
          - text: in the bathroom
            correct: false
            info: Im Bad sind Badewanne, Toilette und Waschbecken.
        explanation: "Das Sofa steht im Wohnzimmer."
        links:
          - title: Lernlandkarte Englisch · There is und there are
            url: https://lernapps.net/apps/map/englisch/c/there-is-are/
      - type: text
        text: "**Das kannst du danach:** Du nennst Räume und Möbel auf Englisch und sagst, was es in deinem Zuhause gibt und wo es steht."
  - type: section
    id: neu
    title: Räume, Möbel und Garten
    blocks:
      - type: text
        text: "Die Räume: **kitchen** (Küche), **living room** (Wohnzimmer), **bathroom** (Bad), **bedroom** (Schlafzimmer), **garden** (Garten). Ein Zimmer heißt **room**: Ellie’s room ist Ellies Zimmer. Die Möbel: **sofa**, **bed** (Bett), **table** (Tisch), **chair** (Stuhl), **desk** (Schreibtisch), **lamp** (Lampe). Was es gibt, sagst du mit **there is** und **there are**, wo es ist, mit **in** (in), **on** (auf), **under** (unter) und **next to** (neben, auch: **beside**): There is a cat in the box. There are shoes next to the door."
      - type: vocabulary
        caption: Klassenzimmer-Poster · Wörter dieser Seite
        languages: { source: de, target: en }
        entries:
          - target: "wardrobe"
            source: "Kleiderschrank"
          - target: "armchair"
            source: "Sessel"
          - target: "cooker"
            source: "Herd"
          - target: "sink"
            source: "Waschbecken / Spüle"
          - target: "bookshelf"
            source: "Bücherregal"
          - target: "bench"
            source: "Gartenbank"
          - target: "toys"
            source: "Spielsachen"
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              **Frage:** Is there … ? und Are there … ? Das Wort there bleibt, is und are stehen davor: Is there a fridge in the kitchen?
              **Mehrere Dinge:** There are, nie There is: There are three lamps.
              **Haus mit Garten:** Das Haus hat einen Garten, deshalb with: a flat with two bedrooms. In the garden heißt mitten im Garten.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: matching
        id: wohnen-paare
        text: In welchem Raum steht das? Ordne zu.
        pairs:
          - { left: fridge, right: in the kitchen }
          - { left: bath, right: in the bathroom }
          - { left: armchair, right: in the living room }
          - { left: wardrobe, right: in the bedroom }
          - { left: bench, right: in the garden }
        explanation: Jedes Möbelstück gehört in den Raum, in dem man es braucht.
        links:
          - title: Lernlandkarte Englisch · There is und there are
            url: https://lernapps.net/apps/map/englisch/c/there-is-are/
      - type: single-choice
        id: wohnen-auf
        text: "Das Buch liegt auf dem Sofa. Wähle: The book is ___ the sofa."
        options:
          - text: "on"
            correct: true
            info: Das Buch liegt oben auf dem Sofa, also on.
          - text: in
            correct: false
            info: in heißt drin. Das Buch läge dann im Sofa.
          - text: under
            correct: false
            info: under heißt unter. Das Buch liegt aber oben.
        explanation: Was oben auf etwas liegt, liegt on.
        links:
          - title: Lernlandkarte Englisch · Präpositionen des Ortes
            url: https://lernapps.net/apps/map/englisch/c/praepositionen-ort/
      - type: language-task
        id: wohnen-there
        languages: { source: de, target: en }
        task: Schreibe den ganzen Satz mit there is oder there are.
        form: { case: hint, punctuation: ok }
        items:
          - cue: a lamp · Ellie's room
            target: "(There is|There's) a lamp in Ellie's (room|bedroom)."
            mistakes:
              - answer: There are a lamp in Ellie's room.
                message: Bei einem Ding steht there is, nicht there are.
          - cue: two lamps · the living room
            target: There are two lamps in the living room.
            mistakes:
              - answer: There is two lamps in the living room.
                message: Bei mehr als einem Ding steht there are, nicht there is.
          - cue: a sink · the bathroom
            target: "(There is|There's) a sink in the bathroom."
            mistakes:
              - answer: There are a sink in the bathroom.
                message: Ein Waschbecken ist ein Ding, also there is.
        hint: Ein Ding oder mehrere?
      - type: language-task
        id: wohnen-frage
        languages: { source: de, target: en }
        task: Schreibe die Frage mit there.
        form: { case: hint, punctuation: ok }
        items:
          - cue: a cooker · the kitchen
            target: Is there a cooker in the kitchen?
            mistakes:
              - answer: Is a cooker in the kitchen?
                message: Das Wort there fehlt. Die Frage beginnt mit Is there.
              - answer: There is a cooker in the kitchen?
                message: In der Frage steht is vor there, nicht danach.
          - cue: two chairs · the kitchen
            target: Are there two chairs in the kitchen?
            mistakes:
              - answer: Is there two chairs in the kitchen?
                message: Bei mehr als einem Ding fragst du mit Are there.
          - cue: a desk · Ellie's room
            target: Is there a desk in Ellie's (room|bedroom)?
            mistakes:
              - answer: Is a desk in Ellie's room?
                message: Das Wort there fehlt. Die Frage beginnt mit Is there.
        hint: Is oder Are, dann there.
      - type: language-task
        id: wohnen-uebersetzen
        languages: { source: de, target: en }
        task: Schreibe den Satz auf Englisch.
        form: { case: hint, punctuation: ok }
        items:
          - source: Ellie wohnt in einem Haus mit Garten.
            target: Ellie lives in a house with a garden.
            mistakes:
              - answer: Ellie lives in a house in the garden.
                message: Das Haus hat einen Garten, deshalb with. in the garden hieße mitten im Garten.
              - answer: Ellie live in a house with a garden.
                message: Zu she gehört lives mit -s.
              - answer: Ellie lives in a house with garden.
                message: "Vor garden fehlt a: Das Haus hat einen Garten, also with a garden."
          - source: Die Schuhe sind im Schrank.
            target: The shoes are in the (wardrobe|cupboard).
            mistakes:
              - answer: The shoes are on the wardrobe.
                message: on heißt oben auf dem Schrank. Im Schrank heißt in.
              - answer: The shoes is in the wardrobe.
                message: Schuhe sind mehrere Dinge, also are.
          - source: Das Sofa steht neben dem Sessel.
            target: The sofa is (next to|beside) the armchair.
            mistakes:
              - answer: The sofa is on the armchair.
                message: on heißt oben auf. Das Sofa steht daneben, also next to.
        hint: Prüfe in, on und with.
      - type: language-task
        id: wohnen-hoeren
        languages: { source: de, target: en }
        task: Hör zu und schreibe, was du hörst.
        form: { case: hint, punctuation: ok }
        items:
          - audio: ellies-desk-is-next-to-the-window.mp3
            target: "(Ellie's desk is|Ellie's desk's) next to the window."
          - audio: peters-toys-are-in-his-bedroom.mp3
            target: Peter's toys are in his bedroom.
          - audio: peters-bag-is-under-the-table.mp3
            target: "(Peter's bag is|Peter's bag's) under the table."
  - type: section
    id: anwenden
    title: Selbst sagen und schreiben
    blocks:
      - type: speaking-task
        id: wohnen-nachsprechen
        language: en
        items:
          - audio: sophies-bedroom-is-small-but-pretty.mp3
            text: Sophie's bedroom is small but pretty.
          - audio: there-is-a-bench-in-the-garden.mp3
            text: There is a bench in the garden.
          - audio: sophies-room-is-next-to-peters-bedroom.mp3
            text: Sophie's room is next to Peter's bedroom.
        hint: Hör den Satz zuerst. Sprich dann langsam nach.
      - type: text
        text: "Dein Profil „All about me“ wächst weiter. Ellie hat eine Zeile über ihr Zimmer geschrieben. Du kannst über ein Zimmer, deine Wohnung oder dein Haus schreiben."
      - type: table
        caption: All about me · Mein Zimmer (Ellies Beispiel)
        header: [Was, Englisch]
        rows:
          - ["Wo wohne ich?", "I live in a house with a garden."]
          - ["Mein Zimmer", "My room is next to Peter's room. It is not big."]
          - ["Was gibt es?", "There is a bed, a desk, a chair and a lamp."]
          - ["Wo steht etwas?", "The lamp is on the desk."]
      - type: open-task
        id: wohnen-profil
        task: "Schreibe den nächsten Teil deines Profils „All about me“ in dein Heft. Du entscheidest, worüber du schreibst: dein Zimmer, deine Wohnung oder dein Haus. Schreibe zwei bis vier Sätze: Wo wohnst du oder welcher Raum ist es, was gibt es dort, und wo steht etwas? Die App bewertet deinen Text nicht: Vergleiche ihn danach selbst mit den Punkten."
        points:
          - text: Du sagst, wo du wohnst oder um welchen Raum es geht, zum Beispiel a flat, a house oder my room.
            source: /zuhause-parkers/wohnen/#neu
          - text: Mit There is oder There are sagst du, was es gibt, und die Form passt zur Zahl.
            source: /zuhause-parkers/wohnen/#neu
          - text: Mit in, on, under oder next to sagst du, wo etwas steht.
            source: /zuhause-parkers/wohnen/#neu
          - text: Es sind ganze Sätze mit einem Punkt am Ende.
            kind: form
        solution: |
          I live in a flat with my mum. My room is small. There is a bed, a desk and a lamp. The lamp is on the desk.

          Oder: I live in a house with a garden. There are two chairs and a table in the kitchen. My room is upstairs.
  - type: section
    id: weiter
    title: Wie es weitergeht
    blocks:
      - type: text
        text: "Sophie schreibt nach Hause: „Das ist mein Zimmer, und das ist das Haus. Als Nächstes zeige ich euch Ellies Tag!“ Auf der nächsten Seite siehst du Ellies Tag in Bildern und sagst dann, wie dein eigener Tag aussieht."
