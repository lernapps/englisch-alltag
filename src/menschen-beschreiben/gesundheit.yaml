# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Wenn etwas wehtut: Beim Arzt"
description: "Peter hat Bauchweh, Mrs Parker geht mit ihm zum Arzt. Du lernst Körperteile und Beschwerden und sagst, was dir fehlt."
competencies: [gesundheit]
scope: Die Seite führt Körperteile wie head, arm, stomach, back und throat ein und zeigt, wie man kleine Beschwerden sagt (My head hurts. I've got a headache. I've got a cold.). Beim Arzt fragt man What's the matter?, der Rat kommt als Befehl (Stay in bed. Drink water.), in der Apotheke fragt man Have you got something for a cold? have got wird nur benutzt, nicht neu erklärt. Gefühle und Streit stehen auf der Seite davor; am Ende blickt die Seite auf das ganze Kapitel zurück.
blocks:
  - type: section
    id: einstieg
    title: Peter hat Bauchweh
    blocks:
      - type: figure
        image: images/szene-gesundheit.svg
        alt: Ein Wartezimmer. Eine Frau mit Dutt und ein Junge sitzen auf einer Bank. Rechts ist eine Tür mit einem grünen Kreuz.
        caption: "Mrs Parker (roter Dutt) und Peter (gelbe Jacke) warten beim Arzt."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: "Peter will sein Frühstück nicht essen. Mrs Parker geht mit ihm zum Arzt (doctor). Im Wartezimmer fragt sie ihn leise: „What’s the matter, Peter?“"
      - type: single-choice
        id: gesundheit-start
        text: "Mrs Parker fragt: „What’s the matter, Peter?“ Was will sie wissen?"
        options:
          - text: Was ist los? Was fehlt dir?
            correct: true
            info: "What’s the matter? fragt, was das Problem ist. Man fragt es, wenn jemand krank aussieht oder traurig ist."
          - text: Wie heißt du?
            correct: false
            info: "Das wäre What’s your name?"
          - text: Wie spät ist es?
            correct: false
            info: "Das wäre What time is it?"
        explanation: "What’s the matter? heißt: Was ist los? Was fehlt dir?"
        links:
          - title: Lernlandkarte Englisch · Gesundheit
            url: https://lernapps.net/apps/map/englisch/c/gesundheit/
      - type: text
        text: "**Das kannst du danach:** Du nennst Körperteile und kleine Beschwerden und sagst beim Arzt oder in der Apotheke, was dir fehlt."
  - type: section
    id: neu
    title: Körperteile und Beschwerden
    blocks:
      - type: labelled-figure
        image: images/koerper.svg
        alt: Eine Figur von vorn, eine von hinten und ein großes Gesicht. Fünf Stellen sind mit Zahlen markiert.
        caption: Körperteile der Figur. Die Zahlen stehen in der Liste.
        labels:
          - { x: 16.4, y: 11.1, text: head }
          - { x: 70.5, y: 38, text: eye }
          - { x: 61.3, y: 52.1, text: ear }
          - { x: 78.1, y: 58, text: nose }
          - { x: 6.2, y: 48.4, text: arm }
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: "Weitere Körperteile: **hand** (Hand), **leg** (Bein), **foot** (Fuß), **stomach** (Bauch, Magen), **back** (Rücken), **tooth** (Zahn), **neck** (Hals, außen) und **throat** (Hals innen, Rachen). Wenn etwas wehtut, sagst du: **My head hurts.** Bei mehreren Teilen fällt das -s weg: My legs hurt. Oder du sagst, was du hast: **I’ve got a stomachache** (Bauchschmerzen). So geht es auch mit **a headache** (Kopfschmerzen), **toothache** oder **a toothache** (Zahnschmerzen), **a cold** (Erkältung), **a cough** (Husten) und **a sore throat** (Halsschmerzen). I’ve got heißt I have got, du kennst es schon."
      - type: table
        caption: Klassenzimmer-Poster · Wörter dieser Seite
        header: [Ausdruck, Bedeutung]
        rows:
          - [stomach, Bauch / Magen]
          - [throat, Hals innen / Rachen]
          - [sore throat, Halsschmerzen]
          - [tooth, Zahn]
          - [cough, Husten]
      - type: example
        title: Beim Arzt und in der Apotheke
        blocks:
          - type: text
            text: |
              - **Doctor:** What’s the matter, Ellie?
              - **Ellie:** I’ve got a sore throat.
              - **Doctor:** Take a rest. Drink tea.
              - **In der Apotheke:** Have you got something for a headache?
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              **Es tut weh:** My arm hurts (ein Teil), My arms hurt (mehrere). **Ich habe:** I’ve got **a** headache und **a** stomachache, mit a; bei toothache geht beides. **Der Rat** ist ein Befehl ohne you: Take a rest. Drink tea. **Sehr schlimm?** Tut etwas sehr weh oder wird es schlimmer, sag es einem Erwachsenen: **Tell an adult.**
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: language-task
        id: gesundheit-koerper
        languages: { source: de, target: en }
        task: Schreibe das englische Wort für das Körperteil mit dem Buchstaben.
        form: { case: hint, punctuation: ok }
        material:
          - type: labelled-figure
            image: images/koerper.svg
            alt: "Eine Figur von vorn, eine von hinten und ein großes Gesicht mit sechs Markierungen: A am Ende eines Arms, B in der Körpermitte, C im Mund des großen Gesichts, D auf der Figur von hinten, E ganz unten und F zwischen Kopf und Körper."
            caption: Welches Körperteil ist markiert?
            legend: false
            labels:
              - { x: 3.9, y: 63.6, text: hand, marker: A }
              - { x: 16.4, y: 52.9, text: stomach, marker: B }
              - { x: 78.1, y: 72.1, text: tooth, marker: C }
              - { x: 45.3, y: 50.8, text: back, marker: D }
              - { x: 13.3, y: 93.0, text: foot, marker: E }
              - { x: 16.4, y: 31.2, text: neck, marker: F }
            source: eigene Zeichnung
            licence: CC-BY-4.0
        items:
          - { marker: A, target: hand }
          - { marker: B, target: stomach }
          - { marker: C, target: tooth }
          - { marker: D, target: back }
          - { marker: E, target: foot }
          - marker: F
            target: neck
            mistakes:
              - answer: throat
                message: throat ist der Hals innen, der Rachen. Hier zeigt die Markierung den Hals von außen.
        hint: Schau dir die Markierung genau an.
      - type: matching
        id: gesundheit-beschwerden
        text: Was fehlt dir? Wähle den englischen Satz.
        pairs:
          - { left: Du hast Husten., right: "I've got a cough." }
          - { left: Du hast Zahnschmerzen., right: "I've got a toothache." }
          - { left: Dein Bein tut weh., right: "My leg hurts." }
          - { left: Du bist erkältet., right: "I've got a cold." }
        explanation: "Mit I’ve got … nennst du die Beschwerde, mit hurts sagst du, welches Teil wehtut."
        links:
          - title: Lernlandkarte Englisch · Gesundheit
            url: https://lernapps.net/apps/map/englisch/c/gesundheit/
      - type: single-choice
        id: gesundheit-artikel
        text: "Peter sagt: „Ich habe Kopfschmerzen.“ Welcher Satz ist richtig?"
        options:
          - text: "I've got a headache."
            correct: true
            info: Vor headache steht a.
          - text: "I've got headache."
            correct: false
            info: Das a fehlt. Bei headache steht a.
          - text: "I've got a head hurts."
            correct: false
            info: "hurts ist ein Verb. Entweder My head hurts oder I've got a headache."
        explanation: "I've got a headache. Bei headache und stomachache steht a."
        links:
          - title: Lernlandkarte Englisch · Gesundheit
            url: https://lernapps.net/apps/map/englisch/c/gesundheit/
      - type: language-task
        id: gesundheit-satz
        languages: { source: de, target: en }
        task: Schreibe den ganzen Satz.
        form: { case: hint, punctuation: ok }
        items:
          - cue: my · arm · hurt
            target: My arm hurts.
            mistakes:
              - answer: My arm hurt.
                message: Ein Teil, also hurts mit -s.
          - cue: he · have got · a cough
            target: "(He has got|He's got|He has) a cough."
            mistakes:
              - answer: He have got a cough.
                message: Zu he gehört has got.
          - cue: I · have got · toothache
            target: "(I have got|I've got|I have) (a |)toothache."
        hint: Hurts oder hurt? Hat man es oder tut es weh?
      - type: language-task
        id: gesundheit-uebersetzen
        languages: { source: de, target: en }
        task: Schreibe den Satz auf Englisch.
        form: { case: hint, punctuation: ok }
        items:
          - source: Mein Rücken tut weh.
            target: My back hurts.
            mistakes:
              - answer: My back hurt.
                message: Ein Teil, also hurts mit -s.
          - source: Hast du etwas gegen Husten?
            target: "(Have you got|Do you have) (something|any medicine|medicine) for a cough?"
            mistakes:
              - answer: Have you got something for cough?
                message: Vor cough steht a.
          - source: Trink Wasser.
            target: "(Please |)drink (some |)water."
            mistakes:
              - answer: You drink water.
                message: "Bei einem Rat lässt du you weg: Drink water."
        hint: Beginne mit my, have you oder dem Befehl.
      - type: language-task
        id: gesundheit-hoeren
        languages: { source: de, target: en }
        task: Hör zu und schreibe, was du hörst.
        form: { case: hint, punctuation: ok }
        items:
          - audio: amir-has-got-a-bad-cold-peter.mp3
            target: "(Amir has got|Amir's got|Amir has) a bad cold, Peter."
          - audio: my-arm-and-my-hand-hurt-sophie.mp3
            target: "My arm and my hand hurt, Sophie."
          - audio: please-eat-some-soup-ellie.mp3
            target: "Please eat some soup, Ellie."
  - type: section
    id: anwenden
    title: Selbst sagen und schreiben
    blocks:
      - type: speaking-task
        id: gesundheit-nachsprechen
        language: en
        items:
          - audio: my-head-hurts-and-i-feel-tired-today.mp3
            text: My head hurts and I feel tired today.
          - audio: is-your-stomach-better-now-peter.mp3
            text: Is your stomach better now, Peter?
          - audio: please-stay-at-home-sophie.mp3
            text: Please stay at home, Sophie.
        hint: Hör den Satz zuerst. Sprich dann langsam nach.
      - type: text
        text: "Die letzte Zeile deines Profils in diesem Kapitel: Ellie hat aufgeschrieben, was sie sagt, wenn ihr etwas wehtut."
      - type: table
        caption: All about me · Wenn mir etwas wehtut (Ellies Beispiel)
        header: [Was, Englisch]
        rows:
          - ["Was fehlt dir?", "I've got a headache."]
          - ["Was tut weh?", "My ear hurts."]
          - ["Was hilft?", "Stay in bed. Drink water."]
          - ["Wenn es schlimmer wird?", "Tell an adult."]
      - type: open-task
        id: gesundheit-profil
        task: "Schreibe in dein Heft, was du sagst, wenn dir etwas wehtut, in drei bis fünf Sätzen: Was tut weh, was hast du, was hilft dir und wen holst du, wenn es schlimmer wird?"
        points:
          - text: Ein Satz sagt mit hurts oder I've got a …, was dir fehlt.
            source: /menschen-beschreiben/gesundheit/#neu
          - text: Du nennst ein Körperteil oder eine Beschwerde von der Seite.
            source: /menschen-beschreiben/gesundheit/#neu
          - text: Ein Satz sagt als Befehl, was hilft (zum Beispiel Take a rest.).
            source: /menschen-beschreiben/gesundheit/#neu
          - text: Ein Satz sagt, dass du es einem Erwachsenen sagst, wenn etwas sehr wehtut (Tell an adult.).
            source: /menschen-beschreiben/gesundheit/#neu
          - text: Es sind ganze Sätze mit einem Punkt am Ende.
            kind: form
        solution: |
          My stomach hurts. I've got a stomachache. Stay in bed. Drink water. Tell an adult.

          Oder: I've got a cold. My nose and my throat hurt. Stay at home. Drink tea. Tell an adult.
  - type: section
    id: weiter
    title: Kapitel geschafft
    blocks:
      - type: text
        text: "Du hast in diesem Kapitel Menschen beschrieben: die Familie mit has got und is, einen Text mit Bauplan, Gefühle und Streit, Körperteile und Beschwerden. Du kannst Menschen und Orte beschreiben, sagen, wie du dich fühlst, und beim Arzt sagen, was dir fehlt. Sophie schickt ihre Nachrichten ab: Ihre Eltern wissen jetzt, wie die Parkers und Mr Hill sind, wie es ihr geht und dass Peter bald wieder gesund ist. Im nächsten Kapitel zeigt sie ihnen das Haus der Parkers."
