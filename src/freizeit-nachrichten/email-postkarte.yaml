# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Liebe Grüße aus Millbrook: E-Mail und Postkarte"
description: "Sophie schreibt ihren Eltern eine Postkarte. Du lernst Anrede, Text und Gruß für Postkarte, Brief und E-Mail."
competencies: [email-postkarte]
scope: Die Seite zeigt den Bauplan eines persönlichen Briefs mit Anrede (Dear Mum and Dad,), Text und Gruß mit Namen (Love, Sophie). Du lernst Anreden und Grüße für Familie, Freunde und Erwachsene, das Komma nach der Anrede und nach dem Gruß, die Zeile Subject einer E-Mail und einen Absatz Text über Wetter, Tun und Befinden (it is cold heißt hier „es ist kalt“). Hobbys, Nachrichten und Einladungen stehen auf den Seiten davor. Briefe an fremde Leser kommen in einer späteren Version.
blocks:
  - type: section
    id: einstieg
    title: Sophie schreibt nach Hause
    blocks:
      - type: figure
        image: images/postkarte.svg
        alt: Eine Postkarte mit drei farbigen Teilen. Rechts neben der Karte steht zu jedem Teil eine Nummer und ein deutsches Wort.
        caption: Sophies Postkarte an ihre Eltern, geteilt in drei Teile.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: "Amir hat Sophies Zusage bekommen. Jetzt schreibt Sophie ihren Eltern eine Postkarte (postcard) und erzählt von Millbrook. Auch eine Karte hat einen Bauplan."
      - type: single-choice
        id: email-postkarte-start
        text: Schau auf die Postkarte. Mit welchem Gruß und Namen endet sie?
        options:
          - text: "Love, Sophie"
            correct: true
            info: Der dritte Teil ist der Gruß mit Namen.
          - text: "Dear Mum and Dad,"
            correct: false
            info: Das ist die Anrede am Anfang.
          - text: Mum and Dad
            correct: false
            info: So heißen die Menschen, an die die Karte geht. Ein Gruß ist das nicht.
        explanation: Am Ende steht der Gruß mit dem Namen der Schreiberin.
        links:
          - title: Lernlandkarte Englisch · E-Mail, Brief und Postkarte
            url: https://lernapps.net/apps/map/englisch/c/email-postkarte/
      - type: text
        text: "**Das kannst du danach:** Du schreibst eine Postkarte oder E-Mail mit passender Anrede und passendem Gruß."
  - type: section
    id: neu
    title: Anrede, Text und Gruß
    blocks:
      - type: text
        text: "Der **Bauplan** hat drei Teile. Die **Anrede** beginnt mit **Dear** (liebe/lieber) oder bei Freunden mit **Hi**, danach kommen der Name und ein **Komma**. Der **Text** sind ganze Sätze: Wie ist das Wetter (sunny, rainy, cold)? Was machst du? Wie geht es dir (tired but happy)? Der **Gruß** steht zuletzt, mit Komma und deinem Namen."
      - type: table
        caption: Klassenzimmer-Poster · Anrede und Gruß
        header: ["An wen?", Anrede, Gruß]
        rows:
          - [Familie, "Dear Mum,", "Love, / Write soon,"]
          - [Freunde, "Hi Ellie, / Dear Ellie,", "See you soon, / Love,"]
          - [Erwachsene (nicht Familie), "Dear Mrs Parker,", "Best wishes,"]
      - type: text
        text: "**Love,** heißt liebe Grüße, **See you soon,** bis bald, **Write soon,** schreib bald. **Best wishes,** (herzliche Grüße) ist freundlich, aber ein Stück weiter weg: Das schreibst du an Erwachsene, die nicht zu deiner Familie gehören. **Yours** ist für offizielle Briefe, nicht für die Familie. Eine **E-Mail** hat zusätzlich eine Zeile **Subject** (Betreff) mit wenigen Wörtern. Eine Postkarte hat keine."
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              **Anrede:** Dear oder Hi + Name + Komma. **Gruß:** Love, / See you soon, / Write soon, an Familie und Freunde, Best wishes, an andere Erwachsene, dann dein Name. **Für Familie:** nie Yours. **Für Erwachsene:** nicht Hi.
      - type: table
        caption: Klassenzimmer-Poster · Wörter dieser Seite
        header: [Ausdruck, Bedeutung]
        rows:
          - [postcard, Postkarte]
          - [best wishes, herzliche Grüße]
          - [subject, Betreff]
          - ["cold (hier: kalt)", "kalt. Nicht: a cold, die Erkältung."]
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: language-task
        id: email-postkarte-anrede
        languages: { source: de, target: en }
        task: Schreibe die Zeile mit Komma. Hinter dem Gruß steht kein Punkt.
        form: { case: hint, punctuation: wrong }
        items:
          - source: Sophie schreibt ihrem Lehrer Mr Hill. Schreibe die Anrede.
            target: Dear Mr(.|) Hill,
            mistakes:
              - answer: Hi Mr Hill,
                message: Hi ist für Freunde. Einen Lehrer redest du mit Dear an.
              - answer: Hello Mr Hill,
                message: Beginne mit Dear.
              - answer: Dear Mr Hill
                message: Nach der Anrede steht ein Komma.
          - source: Sophie schreibt Mr Hill und beendet den Brief. Schreibe den Gruß mit ihrem Namen.
            target: Best wishes, Sophie
            mistakes:
              - answer: Best wishes Sophie
                message: Nach Best wishes steht ein Komma.
              - answer: Best wishes,
                message: Der Name fehlt.
              - answer: Love, Sophie
                message: Love ist für Familie und Freunde.
              - answer: See you soon, Sophie
                message: See you soon ist für Freunde und Familie.
          - cue: "Amir schreibt an einen Freund. Gruß: See you soon · Amir"
            target: See you soon, Amir
            mistakes:
              - answer: See you soon Amir
                message: Nach dem Gruß steht ein Komma.
              - answer: See you soon,
                message: Der Name fehlt.
        hint: Anrede und Gruß haben ein Komma.
      - type: language-task
        id: email-postkarte-korrektur
        languages: { source: de, target: en }
        task: In jeder Zeile steckt ein Fehler. Schreibe die Zeile richtig.
        form: { case: hint, punctuation: wrong }
        items:
          - cue: "Ellie schreibt an ihre Grandma. Gruß: Yours, Ellie"
            target: (Love|Write soon|See you soon), Ellie
            mistakes:
              - answer: Yours, Ellie
                message: Für die Familie passt Yours nicht.
              - answer: Best wishes, Ellie
                message: Best wishes ist für Erwachsene außerhalb der Familie.
          - cue: "Amir schreibt an Mr Parker, den Vater von Ellie. Anrede: Hi Mr Parker,"
            target: Dear Mr(.|) Parker,
            mistakes:
              - answer: Hi Mr Parker,
                message: Mr Parker ist ein Erwachsener. Nimm Dear.
          - cue: "Peter schreibt an seine Mum. Anrede: Dear Mum"
            target: (Dear|Hi) Mum,
            mistakes:
              - answer: Dear Mum
                message: Nach der Anrede steht ein Komma.
        hint: Zu wem passt die Zeile?
      - type: language-task
        id: email-postkarte-text
        languages: { source: de, target: en }
        task: Schreibe den Satz auf Englisch.
        form: { case: hint, punctuation: ok }
        items:
          - source: Heute ist es kalt.
            target: (Today it is|Today it's|It is|It's) (very |)cold( today|).
            mistakes:
              - answer: Is cold today.
                message: Vor is fehlt it (es).
          - source: Ich gehe mit Peter in den Park.
            target: (I go|I walk|I go with Peter|I walk with Peter) to the park( with Peter|).
            mistakes:
              - answer: I go to park with Peter.
                message: Vor park fehlt the.
              - answer: I go in the park with Peter.
                message: Zu einem Ort hin sagst du to the.
          - source: Mir geht es gut.
            target: (I'm|I am|I feel) (fine|well|good|happy|OK|okay|great).
            mistakes:
              - answer: I have fine.
                message: Wie es dir geht, sagst du mit I am.
        hint: Beginne mit it oder I.
      - type: single-choice
        id: email-postkarte-email
        text: Sophie schreibt Mr Hill eine E-Mail über die Hausaufgabe. Was gehört in die Zeile Subject?
        options:
          - text: Homework for Monday
            correct: true
            info: Der Betreff sagt in wenigen Wörtern, worum es geht.
          - text: Dear Mr Hill,
            correct: false
            info: Das ist die Anrede, sie steht im Text.
          - text: Best wishes, Sophie
            correct: false
            info: Das ist der Gruß am Ende.
        explanation: Der Betreff nennt kurz das Thema.
        links:
          - title: Lernlandkarte Englisch · E-Mail, Brief und Postkarte
            url: https://lernapps.net/apps/map/englisch/c/email-postkarte/
      - type: language-task
        id: email-postkarte-hoeren
        languages: { source: de, target: en }
        task: Hör zu und schreibe, was du hörst.
        form: { case: hint, punctuation: ok }
        items:
          - audio: today-we-walk-to-the-shop-with-peter.mp3
            target: Today we walk to the shop with Peter.
          - audio: our-teacher-is-friendly-and-funny.mp3
            target: Our teacher is friendly and funny.
          - audio: it-is-rainy-so-we-read-books-with-amir.mp3
            target: "It is rainy, so we read books with Amir."
  - type: section
    id: anwenden
    title: Selbst sagen und schreiben
    blocks:
      - type: speaking-task
        id: email-postkarte-nachsprechen
        language: en
        items:
          - audio: thank-you-for-your-lovely-postcard-sophie.mp3
            text: "Thank you for your lovely postcard, Sophie."
          - audio: we-play-football-in-the-park-with-amir.mp3
            text: We play football in the park with Amir.
          - audio: please-write-to-me-soon-ellie.mp3
            text: "Please write to me soon, Ellie."
        hint: Hör den Satz zuerst. Sprich dann langsam nach.
      - type: open-task
        id: email-postkarte-profil
        task: "Schreibe eine Postkarte oder eine kurze E-Mail in dein Heft, an eine Person deiner Wahl: an einen Menschen aus deiner Familie, an eine Freundin, einen Freund oder an einen Erwachsenen. Schreibe drei bis fünf Sätze Text. Die App bewertet deinen Text nicht: Vergleiche ihn danach selbst mit den Punkten."
        points:
          - text: Die Karte beginnt mit Dear oder Hi, dem Namen und einem Komma, passend zur Person.
            source: /freizeit-nachrichten/email-postkarte/#neu
          - text: Der Text sagt etwas über das Wetter, über das, was du machst, und darüber, wie es dir geht.
            source: /freizeit-nachrichten/email-postkarte/#neu
          - text: Der Gruß passt zur Person (Love, oder Best wishes,) und steht mit Komma vor deinem Namen.
            source: /freizeit-nachrichten/email-postkarte/#neu
          - text: Es sind ganze Sätze mit einem Punkt am Ende.
            kind: form
        solution: |
          Dear Grandma,
          It is sunny today. I play in the garden with my cousin. I am happy.
          Love, Anna

          Oder: Dear Mrs Green,
          It is rainy, but I am fine. I read a book at home. I am happy.
          Best wishes, Tom
  - type: section
    id: weiter
    title: Dein Profil und ein Rückblick
    blocks:
      - type: table
        caption: All about me · Mein Profil (Ellies Beispiel)
        header: [Zeile, Englisch]
        rows:
          - [Familie, "I live with my mum, my dad and my brother."]
          - [Mein Lieblingsplatz, "My favourite place is my room. It is quiet."]
          - [Gefühle, "I feel happy."]
          - [Wenn mir etwas wehtut, "I've got a headache. My ear hurts."]
          - [Zuhause, "I live in a house with a garden."]
          - [Mein Tag, "I get up at seven o'clock."]
          - [Essen, "I usually have cereal with milk and orange juice."]
          - [Alltag, "We have tea at six o'clock."]
          - [Hobbys, "I like swimming and I play the guitar."]
          - [Einladung, "Come to the cinema with me on Friday at seven."]
      - type: text
        text: "Sophie wirft ihre Karte in den Briefkasten und schreibt ihren Eltern noch: „Hier ist es schön, und am Samstag feiern wir bei Amir!“ Übertrage deine Zeilen in dein Heft: Die App speichert nichts. Du kannst jetzt von deinem Alltag auf Englisch erzählen. Prüfe dich in der Selbsteinschätzung dieses Kapitels."
