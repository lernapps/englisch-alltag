# yaml-language-server: $schema=../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
format: 2
subject: englisch
title: "Alltag: Ich, meine Familie, mein Zuhause"
intro: Sophie (11, aus Deutschland) wohnt im ersten Schuljahr bei den Parkers in Millbrook. Sie schickt ihrer Familie zu Hause Nachrichten über Ellie (11), Ellies kleinen Bruder Peter (9), Amir (11) und den Alltag in England. Du lernst, dich, deine Familie, dein Zuhause, deinen Tag und deine Freizeit auf Englisch zu beschreiben und eine Nachricht, eine Einladung und eine Postkarte zu schreiben. Seite für Seite füllst du dein Profil „All about me“ und vergleichst am Ende deinen Alltag mit dem von Ellie.
languages: [de]
scope:
  text: Die App erklärt Kindern im ersten und zweiten Lernjahr Englisch, wie sie sich, ihre Familie, ihr Zuhause, ihren Tagesablauf, ihr Essen und ihre Freizeit auf Englisch beschreiben und mit dem Alltag in Großbritannien vergleichen. Gelernt werden Familienwörter, Aussehen und Charakter, ein kurzer beschreibender Text, Gefühle und Streit, Körperteile und Beschwerden beim Arzt, Räume und Möbel, der Tagesablauf, Mahlzeiten und Lebensmittel, der Alltag in Großbritannien, Hobbys und Haustiere, Kurznachricht und Einladung sowie persönliche E-Mail und Postkarte (Anrede, Text, Gruß). Beispiele stammen aus dem Alltag von Sophie, Ellie, Peter, Amir und der Familie Parker. Die Kinder schreiben ihr Profil „All about me“ in ihr Heft; die App speichert nichts.
  out:
    - Schule, Uhrzeit und Datum (steht im Explainer „Hello, Millbrook!“)
    - Stadt, Einkaufen und Reisen (spätere Version)
    - Meinungen zu Sport, Musik und Medien (spätere Version)
    - Geschichten erzählen (spätere Version)
    - Briefe an fremde Leser, zum Beispiel Bewerbungen (spätere Version)
chapters: [menschen-beschreiben, zuhause-parkers, freizeit-nachrichten]
